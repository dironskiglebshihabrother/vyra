[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/dironskiglebshihabrother/vyra"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

# Dependencies are optimized even in debug builds: decoding audio in tests is slow otherwise.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
