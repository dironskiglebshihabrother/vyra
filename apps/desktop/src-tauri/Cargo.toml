[package]
name = "vyra-desktop"
description = "VYRA desktop application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vyra"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
vyra-audio = { path = "../../../crates/vyra-audio" }
vyra-library = { path = "../../../crates/vyra-library" }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
