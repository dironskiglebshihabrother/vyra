[package]
name = "vyra-library"
description = "VYRA music library: database, folder scanner, artwork cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
lofty = "0.25.5"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
image = "0.25.10"
lofty = "0.25.5"
tempfile = "3.27.0"
